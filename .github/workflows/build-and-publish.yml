name: Build, Test, and Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  checks: write
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Get branch name (merge)
      if: github.event_name != 'pull_request'
      shell: bash
      run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV
    
    - name: Get branch name (pull request)
      if: github.event_name == 'pull_request'
      shell: bash
      run: echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_ENV

    - name: Get pre-release version
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      id: get_pre_release_version
      uses: paulhatch/semantic-version@v6.0.1
      with:
        tag_prefix: "v"
        version_format: "${major}.${minor}.${patch}-prerelease-${{ env.BRANCH_NAME }}-${increment}"
        major_pattern: "(MAJOR)"
        minor_pattern: "(MINOR)"
        search_commit_body: true

    - name: Set package version (pre-release)
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      run: echo "PACKAGE_VERSION=${{ steps.get_pre_release_version.outputs.version }}" >> $GITHUB_ENV

    - name: Get release version
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      id: get_release_version
      uses: paulhatch/semantic-version@v6.0.1
      with:
        tag_prefix: "v"
        version_format: "${major}.${minor}.${patch}"
        major_pattern: "(MAJOR)"
        minor_pattern: "(MINOR)"
        search_commit_body: true

    - name: Set package version (release)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: echo "PACKAGE_VERSION=${{ steps.get_release_version.outputs.version }}" >> $GITHUB_ENV
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --results-directory ${{ github.workspace }}/test-results/ --logger trx

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
          files: |
            ${{ github.workspace }}/test-results/*.trx
    
    - name: Pack NuGet package
      run: dotnet pack SqliteCache.AspNetCore/SqliteCache.AspNetCore.csproj -c Release -o ./artifacts -p:DebugSymbols=true -p:DebugType=embedded -p:Version=${{ env.PACKAGE_VERSION }}
    
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push ./artifacts/*.nupkg \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate
